# Tests for the `stdlib` branch of this fork, on Linux, with the nix dev shell
# (the same environment as local development, see flake.nix and
# doc/stdlib-gap-analysis.md). The upstream workflow (test.yaml) runs only on `dev`.
name: Test stdlib

on:
  workflow_dispatch:
  push:
    branches:
      - stdlib

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # used by test/lib/zip1 and compress1 for interoperability checks
      - name: Install zip tools
        run: sudo apt-get install -y zip unzip gzip

      - name: Install nix
        uses: cachix/install-nix-action@v31

      # restored and saved separately, so the cache is also saved when tests fail
      - name: Restore cabal store and build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ matrix.os }}-${{ hashFiles('koka.cabal', 'package.yaml', 'cabal.project*', 'flake.lock') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ matrix.os }}-${{ hashFiles('koka.cabal', 'package.yaml', 'cabal.project*', 'flake.lock') }}-
            cabal-${{ matrix.os }}-

      - name: Build compiler
        run: |
          nix develop -c cabal update
          nix develop -c cabal build exe:koka koka-test

      - name: Save cabal store and build
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ matrix.os }}-${{ hashFiles('koka.cabal', 'package.yaml', 'cabal.project*', 'flake.lock') }}-${{ github.sha }}

      - name: Test suite (C)
        run: nix develop -c cabal run koka-test

      # Known differences on JS: float formatting (ddouble1-3, double2, double4),
      # threads (task-publish, task-shared, sync-condition: C only), and deep
      # recursion beyond the stack (physicists-stack).
      - name: Test suite (JavaScript)
        continue-on-error: true
        run: nix develop -c cabal run koka-test -- --target-js
