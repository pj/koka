# Tests for the `stdlib` branch of this fork, on Linux, with the nix dev shell
# (the same environment as local development, see flake.nix and
# doc/stdlib-gap-analysis.md). The upstream workflow (test.yaml) runs only on `dev`.
name: Test stdlib

on:
  workflow_dispatch:
  push:
    branches:
      - stdlib

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # used by test/lib/zip1 and compress1 for interoperability checks
      - name: Install zip tools
        run: sudo apt-get install -y zip unzip gzip

      - name: Install nix
        uses: cachix/install-nix-action@v31

      # restored and saved separately, so the cache is also saved when tests fail
      - name: Restore cabal store and build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ matrix.os }}-${{ hashFiles('koka.cabal', 'package.yaml', 'cabal.project*', 'flake.lock') }}-${{ github.sha }}
          restore-keys: |
            cabal-${{ matrix.os }}-${{ hashFiles('koka.cabal', 'package.yaml', 'cabal.project*', 'flake.lock') }}-
            cabal-${{ matrix.os }}-

      - name: Build compiler
        run: |
          nix develop -c cabal update
          nix develop -c cabal build exe:koka koka-test

      - name: Save cabal store and build
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ matrix.os }}-${{ hashFiles('koka.cabal', 'package.yaml', 'cabal.project*', 'flake.lock') }}-${{ github.sha }}

      - name: Test suite (C)
        run: nix develop -c cabal run koka-test

      # Known differences on JS: float formatting (ddouble1-3, double2, double4),
      # threads (task-publish, task-shared, sync-condition: C only), and deep
      # recursion beyond the stack (physicists-stack).
      - name: Test suite (JavaScript)
        continue-on-error: true
        run: nix develop -c cabal run koka-test -- --target-js

  # Windows (MSVC, with vcpkg for C libraries), set up as in the upstream
  # workflow (test.yaml). The suite is informational here for now: some tests
  # use Unix tools (sh, cat, zip).
  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # keep LF line endings: tests have multi-line string literals and read text data files
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2.2
        with:
          arch: x64

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # install the C libraries up front (koka would otherwise install them while
      # tests run, and vcpkg's messages would end up in the test output)
      - name: Install C libraries
        run: |
          & "$env:VCPKG_ROOT\vcpkg" install --triplet x64-windows-static-md libuv pcre2 zlib sqlite3 brotli zstd mbedtls
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows-static-md\lib" | Select-Object -ExpandProperty Name

      - name: Build compiler
        uses: freckle/stack-action@c5b62aa4c722658775d1c53d501a21bca1d28c5a #v5.7.29
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          test: false
          stack-build-arguments: "--fast"
          cache-save-always: true

      # the test output does not include the C compiler's messages; show them here
      - name: Compile diagnostics
        continue-on-error: true
        timeout-minutes: 15
        run: |
          foreach ($t in "util/dev/win-diag.kk") { stack exec koka -- -e $t }

      - name: Test suite (C)
        continue-on-error: true
        timeout-minutes: 100   # a hanging test should not use up the job
        run: stack test --fast --test-arguments=--seq   # parallel builds of shared test modules collide on Windows
